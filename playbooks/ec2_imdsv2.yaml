id: "playbook-ec2-imdsv2"
name: "EC2 IMDSv2 Enforcement"
description: "Require IMDSv2 for EC2 instances to prevent SSRF attacks on metadata service"
vulnerability_type: ec2_imdsv1
cloud_provider: AWS
resource_type: "AWS::EC2::Instance"
severity: High
version: "1.0.0"

search_text: |
  EC2 instance metadata service IMDSv1 IMDSv2 SSRF vulnerability
  AWS EC2 metadata token required hop limit IMDS security

tags:
  - ec2
  - imds
  - metadata
  - ssrf

compliance_frameworks:
  - "CIS AWS 5.6"
  - "NIST 800-53 SC-8"
  - "AWS Best Practices"

required_permissions:
  - ec2:DescribeInstances
  - ec2:ModifyInstanceMetadataOptions

estimated_execution_time_seconds: 15

pre_check_code: |
  import boto3
  
  def pre_check(instance_id: str, **kwargs) -> dict:
      """Check if EC2 instance requires IMDSv2."""
      ec2 = boto3.client('ec2', endpoint_url='{{AWS_ENDPOINT_URL}}')
      
      response = ec2.describe_instances(InstanceIds=[instance_id])
      
      if not response['Reservations'] or not response['Reservations'][0]['Instances']:
          return {"needs_remediation": False, "error": "Instance not found"}
      
      instance = response['Reservations'][0]['Instances'][0]
      metadata_options = instance.get('MetadataOptions', {})
      
      http_tokens = metadata_options.get('HttpTokens', 'optional')
      http_endpoint = metadata_options.get('HttpEndpoint', 'enabled')
      
      return {
          "needs_remediation": http_tokens != 'required',
          "http_tokens": http_tokens,
          "http_endpoint": http_endpoint,
          "http_put_response_hop_limit": metadata_options.get('HttpPutResponseHopLimit', 1),
          "instance_state": instance.get('State', {}).get('Name')
      }

remediation_code: |
  import boto3
  
  def remediate(instance_id: str, hop_limit: int = 1, **kwargs) -> dict:
      """Enforce IMDSv2 on the EC2 instance."""
      ec2 = boto3.client('ec2', endpoint_url='{{AWS_ENDPOINT_URL}}')
      
      ec2.modify_instance_metadata_options(
          InstanceId=instance_id,
          HttpTokens='required',
          HttpPutResponseHopLimit=hop_limit,
          HttpEndpoint='enabled'
      )
      
      return {
          "success": True,
          "action": "imdsv2_required",
          "instance_id": instance_id,
          "http_tokens": "required",
          "hop_limit": hop_limit
      }

post_check_code: |
  import boto3
  
  def post_check(instance_id: str, **kwargs) -> dict:
      """Verify IMDSv2 is now required."""
      ec2 = boto3.client('ec2', endpoint_url='{{AWS_ENDPOINT_URL}}')
      
      response = ec2.describe_instances(InstanceIds=[instance_id])
      instance = response['Reservations'][0]['Instances'][0]
      metadata_options = instance.get('MetadataOptions', {})
      
      return {
          "verified": metadata_options.get('HttpTokens') == 'required',
          "http_tokens": metadata_options.get('HttpTokens')
      }
