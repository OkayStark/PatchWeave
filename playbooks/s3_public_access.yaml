id: "playbook-s3-public-access"
name: "S3 Block Public Access Remediation"
description: |
  Enables S3 Block Public Access settings on a bucket that is currently 
  publicly accessible. This is a critical security control that prevents
  accidental public exposure of S3 bucket contents.
  
  This playbook applies all four Block Public Access settings:
  - BlockPublicAcls: Rejects PUT requests with public ACLs
  - IgnorePublicAcls: Ignores existing public ACLs
  - BlockPublicPolicy: Rejects bucket policies that grant public access
  - RestrictPublicBuckets: Restricts access to buckets with public policies

vulnerability_type: s3_public_access
cloud_provider: AWS
resource_type: "AWS::S3::Bucket"
severity: Critical
version: "1.0.0"

search_text: |
  S3 bucket public access enabled publicly accessible bucket
  S3 bucket ACL public block public access disabled
  S3 public read write access bucket policy allows public
  S3 bucket exposed to internet AWS S3 public bucket security

tags:
  - s3
  - storage
  - public-access
  - critical

compliance_frameworks:
  - "CIS AWS Foundations 2.1.5"
  - "SOC2"
  - "PCI-DSS"
  - "HIPAA"

required_permissions:
  - s3:GetPublicAccessBlock
  - s3:PutPublicAccessBlock

estimated_execution_time_seconds: 5

pre_check_code: |
  import boto3
  from botocore.exceptions import ClientError
  
  def pre_check(bucket_name: str, **kwargs) -> dict:
      """Check if S3 bucket has public access enabled."""
      s3 = boto3.client('s3', endpoint_url='{{AWS_ENDPOINT_URL}}')
      
      try:
          response = s3.get_public_access_block(Bucket=bucket_name)
          config = response['PublicAccessBlockConfiguration']
          
          # Check if ALL settings are True (fully blocked)
          is_fully_blocked = all([
              config.get('BlockPublicAcls', False),
              config.get('IgnorePublicAcls', False),
              config.get('BlockPublicPolicy', False),
              config.get('RestrictPublicBuckets', False)
          ])
          
          if is_fully_blocked:
              return {
                  "needs_remediation": False,
                  "current_state": "blocked",
                  "config": config
              }
          else:
              return {
                  "needs_remediation": True,
                  "current_state": "public_access_possible",
                  "config": config
              }
              
      except ClientError as e:
          if e.response['Error']['Code'] == 'NoSuchPublicAccessBlockConfiguration':
              return {
                  "needs_remediation": True,
                  "current_state": "no_config",
                  "error": "No public access block configuration exists"
              }
          raise

remediation_code: |
  import boto3
  
  def remediate(bucket_name: str, **kwargs) -> dict:
      """Enable Block Public Access for S3 bucket."""
      s3 = boto3.client('s3', endpoint_url='{{AWS_ENDPOINT_URL}}')
      
      # Enable all Block Public Access settings
      s3.put_public_access_block(
          Bucket=bucket_name,
          PublicAccessBlockConfiguration={
              'BlockPublicAcls': True,
              'IgnorePublicAcls': True,
              'BlockPublicPolicy': True,
              'RestrictPublicBuckets': True
          }
      )
      
      return {
          "success": True,
          "message": f"Enabled Block Public Access for {bucket_name}",
          "applied_settings": {
              "BlockPublicAcls": True,
              "IgnorePublicAcls": True,
              "BlockPublicPolicy": True,
              "RestrictPublicBuckets": True
          }
      }

post_check_code: |
  import boto3
  
  def post_check(bucket_name: str, **kwargs) -> dict:
      """Verify Block Public Access is enabled."""
      s3 = boto3.client('s3', endpoint_url='{{AWS_ENDPOINT_URL}}')
      
      response = s3.get_public_access_block(Bucket=bucket_name)
      config = response['PublicAccessBlockConfiguration']
      
      # Verify ALL settings are now True
      checks = {
          'BlockPublicAcls': config.get('BlockPublicAcls', False),
          'IgnorePublicAcls': config.get('IgnorePublicAcls', False),
          'BlockPublicPolicy': config.get('BlockPublicPolicy', False),
          'RestrictPublicBuckets': config.get('RestrictPublicBuckets', False),
      }
      
      all_enabled = all(checks.values())
      failed = [k for k, v in checks.items() if not v]
      
      return {
          "verified": all_enabled,
          "settings": checks,
          "failed_settings": failed if not all_enabled else []
      }
