id: "playbook-s3-encryption"
name: "S3 Bucket Encryption Remediation"
description: "Enable server-side encryption (AES-256) for S3 buckets that lack encryption configuration"
vulnerability_type: s3_encryption_disabled
cloud_provider: AWS
resource_type: "AWS::S3::Bucket"
severity: High
version: "1.0.0"

search_text: |
  S3 bucket encryption server-side AES-256 SSE KMS unencrypted data at rest
  AWS S3 bucket missing encryption configuration security compliance data protection

tags:
  - s3
  - encryption
  - data-at-rest
  - compliance

compliance_frameworks:
  - "CIS AWS 2.1.1"
  - "SOC 2 CC6.1"
  - "HIPAA 164.312(a)(2)(iv)"

required_permissions:
  - s3:GetBucketEncryption
  - s3:PutBucketEncryption

estimated_execution_time_seconds: 15

pre_check_code: |
  import boto3
  from botocore.exceptions import ClientError
  
  def pre_check(bucket_name: str, **kwargs) -> dict:
      """Check if S3 bucket lacks encryption configuration."""
      s3 = boto3.client('s3', endpoint_url='{{AWS_ENDPOINT_URL}}')
      
      try:
          response = s3.get_bucket_encryption(Bucket=bucket_name)
          config = response.get('ServerSideEncryptionConfiguration', {})
          rules = config.get('Rules', [])
          
          # Check if encryption is actually configured
          # LocalStack returns empty {} after encryption is deleted
          if rules and len(rules) > 0:
              rule = rules[0]
              default_encryption = rule.get('ApplyServerSideEncryptionByDefault', {})
              if default_encryption.get('SSEAlgorithm'):
                  return {
                      "needs_remediation": False,
                      "current_state": "encrypted",
                      "encryption_type": default_encryption.get('SSEAlgorithm', 'unknown')
                  }
          
          # Empty rules or no SSEAlgorithm means not properly encrypted
          return {
              "needs_remediation": True,
              "current_state": "unencrypted",
              "message": "No encryption configuration found"
          }
          
      except ClientError as e:
          error_code = e.response['Error']['Code']
          if error_code in ['ServerSideEncryptionConfigurationNotFoundError', 'NoSuchBucketEncryption']:
              return {
                  "needs_remediation": True,
                  "current_state": "unencrypted",
                  "message": "No encryption configuration found"
              }
          raise
      
      return {"needs_remediation": True, "current_state": "unencrypted"}

remediation_code: |
  import boto3
  
  def remediate(bucket_name: str, **kwargs) -> dict:
      """Enable AES-256 server-side encryption for the S3 bucket."""
      s3 = boto3.client('s3', endpoint_url='{{AWS_ENDPOINT_URL}}')
      
      encryption_config = {
          'Rules': [{
              'ApplyServerSideEncryptionByDefault': {
                  'SSEAlgorithm': 'AES256'
              },
              'BucketKeyEnabled': True
          }]
      }
      
      s3.put_bucket_encryption(
          Bucket=bucket_name,
          ServerSideEncryptionConfiguration=encryption_config
      )
      
      return {
          "success": True,
          "action": "enabled_encryption",
          "encryption_type": "AES256",
          "bucket": bucket_name
      }

post_check_code: |
  import boto3
  
  def post_check(bucket_name: str, **kwargs) -> dict:
      """Verify encryption is now enabled on the bucket."""
      s3 = boto3.client('s3', endpoint_url='{{AWS_ENDPOINT_URL}}')
      
      response = s3.get_bucket_encryption(Bucket=bucket_name)
      rules = response.get('ServerSideEncryptionConfiguration', {}).get('Rules', [])
      
      if rules:
          algorithm = rules[0].get('ApplyServerSideEncryptionByDefault', {}).get('SSEAlgorithm')
          return {
              "verified": True,
              "encryption_enabled": True,
              "algorithm": algorithm
          }
      
      return {"verified": False, "encryption_enabled": False}
